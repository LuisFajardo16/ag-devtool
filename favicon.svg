  <line x1="6" y1="16" x2="58" y2="16" stroke="#334155" stroke-width="2" />
  <circle cx="13" cy="10" r="2.2" fill="#F43F5E" />
  <circle cx="20" cy="10" r="2.2" fill="#F59E0B" />
