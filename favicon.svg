  <path d="M13 28L23 36L13 44" stroke="#818CF8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="25" y1="45" x2="34" y2="45" stroke="#34D399" stroke-width="4" stroke-linecap="round" />
  <!-- Mini cuadrícula de paneles a la derecha -->
  <rect x="40" y="23" width="13" height="10" rx="2.5" fill="#4F46E5" fill-opacity="0.35" stroke="#818CF8" stroke-width="2" />
  <rect x="40" y="37" width="13" height="11" rx="2.5" fill="#10B981" fill-opacity="0.25" stroke="#34D399" stroke-width="2" />
