<!DOCTYPE html>
<html lang="es" class="dark h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AG-DevTool — Entorno Modular de Utilidades para Desarrollo</title>
    <meta
      name="description"
      content="Entorno modular de utilidades para el desarrollo de software en Vanilla JS, HTML5 y Tailwind CSS con hasta 6 paneles redimensionables y persistencia en localStorage."
    />
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
              mono: ['JetBrains Mono', 'Fira Code', 'Consolas', 'monospace']
            }
          }
        }
      };
    </script>
    <link rel="stylesheet" href="./src/styles/main.css" />
  </head>
  <body class="h-full w-full overflow-hidden bg-slate-950 text-slate-100 antialiased selection:bg-indigo-500/30 selection:text-indigo-200">
    <div id="app" class="h-full w-full flex flex-col overflow-hidden">
      <!-- Topbar -->
      <div id="topbar-root" class="shrink-0"></div>

      <!-- Cuerpo Principal: Sidebar Colapsable + Workspace de Paneles (1 a 6) -->
      <div class="flex-1 flex min-h-0 overflow-hidden">
        <div id="sidebar-root" class="h-full shrink-0"></div>
        <main id="workspace-root" class="flex-1 h-full min-w-0 overflow-hidden bg-slate-950"></main>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
